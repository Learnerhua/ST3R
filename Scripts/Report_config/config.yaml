# =============================================================================
# Spateo 三维重建分析报告 - 配置文件
# 分析人员在交付前编辑本文件即可，无需改动脚本。
# 只有 project 段和少量开关需要手动填写，其余为报告默认设置。
# =============================================================================

# ---------------------------------------------------------------------------
# 1. 项目信息（必填，展示在报告首页）
# ---------------------------------------------------------------------------
project:
  ID: KM-XS-XXXX-XXX                 # 项目编号
  name: 时空转录组三维重建分析项目      # 项目名称
  species: 香芽蕉                     # 物种 / 样本来源
  description: >-                     # 项目描述（一句话概述研究目的）
    本项目基于时空转录组切片数据，利用 Spateo 完成空间域识别、切片对齐、
    三维组织模型重建、骨架构建与差异表达分析、形态学量化及基因表达三维插值，
    系统刻画样本在三维空间中的基因表达格局。
  author: 康美华大生信部               # 分析负责人 / 部门
  date: 2026-07-13                    # 报告日期

# ---------------------------------------------------------------------------
# 2. 报告设置
# ---------------------------------------------------------------------------
report:
  title: 时空转录组数据三维重建标准分析报告      # 报告主标题（浏览器标签 & 顶部）
  # 交互式 3D 模型内嵌策略：
  #   embed_interactive_3d = true 时，体积 <= max_embed_mb 的交互式 HTML 以 iframe 内嵌到
  #   单文件 HTML 报告中；超过阈值的自动降级为静态 PNG（PDF 始终使用 PNG）。
  embed_interactive_3d: true
  max_embed_mb: 60                    # 单个交互式 3D HTML 内嵌体积上限 (MB)

# ---------------------------------------------------------------------------
# 3. 软件版本（可手动指定；未填则脚本自动探测；都没有则不展示该项）
# ---------------------------------------------------------------------------
software_versions:                    # 软件展示顺序：Spateo / Scanpy / Squidpy / PyVista / PyTorch / Stereopy
  Stereopy:                          # 不填则按 Scripts/01..10.py 的 shebang 自动探测
  Scanpy:
  Squidpy:
  Spateo: 1.1.0
  PyTorch: 2.11.0
  PyVista:

# ---------------------------------------------------------------------------
# 3. PDF 页眉页脚（复用 KMHD 品牌，通常无需改动）
# ---------------------------------------------------------------------------
pdf_header_footer:
  header:
    enabled: true
    logo: assets/images/logo.png
    right_text: "康美华大时空转录组三维重建分析报告"
    logo_height: "25px"
  footer:
    enabled: true
    text: "康美华大基因技术有限公司 | https://www.kmhdgene.com"
    show_page_numbers: true
  margins:
    top: "25mm"
    bottom: "20mm"
    left: "10mm"
    right: "10mm"
